version: '3.8'

services:
  counselweb-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: counselweb-api:latest
    container_name: counselweb-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/counselweb
      - JWT_SECRET=${JWT_SECRET:-please_change_this_secret_in_prod}
      - REFRESH_SECRET=${REFRESH_SECRET:-please_change_this_refresh_secret}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - counselweb-net

  mongodb:
    image: mongo:6.0
    container_name: counselweb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - counselweb-mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - counselweb-net

volumes:
  counselweb-mongo-data:

networks:
  counselweb-net:
    driver: bridge
